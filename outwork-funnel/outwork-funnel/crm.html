<style>
/* ══════════ FONTS ══════════
   Body  : Aktiv Grotesk (Adobe Fonts) — needs your Typekit kit link in <head>.
           Falls back to Figtree (the previous face) so nothing regresses.
   Display: Neue Plak ExtraBlack — self-hosted from /assets/fonts.
*/
@font-face{
  font-family:'Neue Plak ExtraBlack';
  src:url('assets/fonts/NeuePlak-ExtraBlack.woff2') format('woff2'),
      url('assets/fonts/NeuePlak-ExtraBlack.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}

/* ══════════ TOKENS ══════════ */
:root{
  --blue:#5370FE;
  --pink:#FD66C5;
  --grad:linear-gradient(97deg,#5370FE 0%,#8A6BEC 48%,#FD66C5 100%);
  --bg:#07070B;
  --bg-2:#0B0B12;
  --surface:#101019;
  --surface-2:#15151F;
  --raise:#1A1A26;
  --ink:#F5F5FA;
  --ink-2:#C8CADA;
  --muted:#878BA3;
  --faint:#63667C;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --font-body:"aktiv-grotesk","Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-display:"Neue Plak ExtraBlack","aktiv-grotesk","Figtree",Impact,"Arial Black",sans-serif;
  --radius:22px;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px -16px rgba(0,0,0,.85);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 40px 90px -30px rgba(83,112,254,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
::selection{background:rgba(253,102,197,.35);color:#fff}

/* ══════════ LAYOUT ══════════ */
.wrap{width:min(1120px,92vw);margin-inline:auto}
.narrow{width:min(760px,92vw);margin-inline:auto}
section{position:relative}
.pad{padding:clamp(64px,9vw,120px) 0}
.pad-sm{padding:clamp(48px,6vw,80px) 0}
.center{text-align:center}

/* ══════════ TYPE ══════════ */
h1,h2,h3{
  margin:0;font-family:var(--font-display);font-weight:400;
  letter-spacing:-.018em;line-height:1.06;
  font-synthesis-weight:none;-webkit-font-synthesis:none;
}
h1{font-size:clamp(34px,5.6vw,60px)}
h2{font-size:clamp(29px,4.4vw,48px)}
h3{font-size:clamp(19px,2.2vw,24px);letter-spacing:-.02em;line-height:1.25}

/* accent span: same display face, gradient fill carries the emphasis */
.ital{
  font-family:var(--font-display);font-weight:400;font-style:normal;
  text-transform:uppercase;letter-spacing:-.004em;
  font-size:1em;line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  padding-right:.04em;
}
.lede{
  color:var(--muted);font-size:clamp(16px,1.7vw,18.5px);line-height:1.64;
  max-width:56ch;margin:20px auto 0;
}
.lede.left{margin-inline:0}
.tiny{font-size:13.5px;color:var(--faint);line-height:1.55}
strong{color:var(--ink);font-weight:700}
em{color:var(--ink-2)}

/* ══════════ BADGES / LABELS ══════════ */
.badge{
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 20px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.035);
  font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);backdrop-filter:blur(6px);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--grad);flex:none;
  box-shadow:0 0 10px rgba(253,102,197,.9)}
.eyebrow{
  display:inline-flex;align-items:center;gap:14px;
  font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:#9FA6FF;margin-bottom:22px;
}
.eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28))}
.eyebrow::after{background:linear-gradient(90deg,rgba(255,255,255,.28),transparent)}
.eyebrow.dotted::before,.eyebrow.dotted::after{display:none}
.eyebrow.dotted{gap:9px}
.eyebrow.dotted i{width:7px;height:7px;border-radius:50%;background:var(--grad);display:block;
  box-shadow:0 0 10px rgba(253,102,197,.9)}

/* ══════════ SECTION KICKER ══════════
   Big display label that says whose numbers the section is showing.
   Deliberately a step smaller than the h2 under it so it labels rather
   than competes. */
.kicker{
  display:block;font-family:var(--font-display);font-weight:400;
  text-transform:uppercase;letter-spacing:-.012em;line-height:1;
  font-size:clamp(21px,2.9vw,32px);
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  margin:0 0 14px;font-synthesis-weight:none;
}

/* ══════════ BUTTONS ══════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:11px;
  padding:19px 40px;border-radius:999px;border:0;cursor:pointer;
  background:var(--grad);color:#fff;
  font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  text-decoration:none;position:relative;isolation:isolate;
  box-shadow:0 12px 40px -8px rgba(120,90,240,.75),0 0 0 1px rgba(255,255,255,.08) inset;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,filter .18s;
}
.btn::after{content:"→";font-size:15px;letter-spacing:0;transition:transform .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 54px -10px rgba(140,100,250,.85),0 0 0 1px rgba(255,255,255,.12) inset}
.btn:hover::after{transform:translateX(4px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost::after{content:""}
.btn.ghost:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}

/* ══════════ HERO ══════════ */
.hero{padding-top:clamp(30px,5vw,54px);padding-bottom:clamp(40px,5vw,64px);overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:-24% -20% auto -20%;height:900px;z-index:0;pointer-events:none;
  background:
    radial-gradient(42% 40% at 20% 20%,rgba(83,112,254,.36),transparent 70%),
    radial-gradient(40% 38% at 82% 30%,rgba(253,102,197,.30),transparent 70%),
    radial-gradient(60% 44% at 50% 0%,rgba(138,107,236,.20),transparent 72%);
  filter:blur(24px);
}
.hero .wrap{position:relative;z-index:1}
.brandbar{display:flex;justify-content:center;padding:26px 0 30px}
.logo{display:inline-flex;align-items:center;text-decoration:none;line-height:0}
.logo img{height:34px;width:auto;display:block}
footer .logo img{height:28px}
.apply-top .logo img{height:30px}
@media (max-width:620px){.logo img{height:27px}footer .logo img{height:24px}.apply-top .logo img{height:25px}}

/* ══════════ VIDEO ══════════ */
.video-shell{position:relative;margin:clamp(34px,4.5vw,52px) auto 0;width:min(880px,92vw)}
.video-shell::before{
  content:"";position:absolute;inset:-30px;border-radius:38px;z-index:0;
  background:var(--grad);opacity:.34;filter:blur(46px);
}
.video-frame{
  position:relative;z-index:1;border-radius:18px;overflow:hidden;
  aspect-ratio:16/9;background:#000;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 40px 90px -30px rgba(0,0,0,.9);
}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-ph{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;text-align:center;padding:24px;
  background:radial-gradient(90% 90% at 50% 40%,#1B1D33,#08080D);color:#fff;
}
.video-ph .ring{
  width:74px;height:74px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;box-shadow:0 14px 44px -6px rgba(120,90,240,.95);
}
.video-ph .ring svg{width:26px;height:26px;margin-left:4px;fill:#fff}
.video-ph b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.video-ph small{font-size:13px;color:var(--muted);max-width:36ch;line-height:1.5}
.unmute{
  position:absolute;inset:0;z-index:2;display:grid;place-items:center;cursor:pointer;
  background:rgba(4,4,8,.28);border:0;width:100%;
  transition:background .2s,opacity .25s;
}
.unmute:hover{background:rgba(4,4,8,.42)}
.unmute .pill{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:26px 40px;border-radius:20px;
  background:linear-gradient(135deg,rgba(83,112,254,.92),rgba(253,102,197,.92));
  backdrop-filter:blur(6px);color:#fff;text-align:center;
  box-shadow:0 20px 56px -12px rgba(0,0,0,.75);
}
.unmute .pill svg{width:34px;height:34px;fill:#fff}
.unmute .pill b{font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.015em}
.unmute[hidden]{display:none}

/* ══════════ QUIZ ══════════ */
.quiz-anchor{scroll-margin-top:24px}
.quiz{
  position:relative;width:min(700px,92vw);margin:clamp(30px,4vw,44px) auto 0;
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line-2);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.quiz .bar{height:4px;background:rgba(255,255,255,.08)}
.quiz .bar i{display:block;height:100%;width:20%;background:var(--grad);
  box-shadow:0 0 18px rgba(140,100,250,.9);transition:width .42s cubic-bezier(.4,0,.2,1)}
.quiz .body{padding:clamp(30px,4.5vw,48px) clamp(24px,4.5vw,52px) clamp(26px,3.5vw,38px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:16px}
.q-head .l{display:flex;align-items:center;gap:13px;font-size:11px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.q-head .l b{color:#9FA6FF;font-weight:800}
.q-head .l s{width:22px;height:1px;background:rgba(255,255,255,.2);text-decoration:none;display:block}
.q-head .r{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
.q-title{font-family:var(--font-display);font-size:clamp(22px,3.1vw,31px);font-weight:400;
  letter-spacing:-.018em;line-height:1.16;margin:0;font-synthesis-weight:none}
.q-sub{color:var(--muted);font-size:15.5px;margin:11px 0 0}
.q-note{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.q-note i{width:6px;height:6px;border-radius:50%;background:var(--grad);display:block;flex:none}
.q-body{margin-top:28px;min-height:186px}

/* choice options */
.opts{display:grid;gap:11px}
.opt{
  display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  padding:17px 20px;border-radius:15px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1.5px solid var(--line);
  font-size:16.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
  transition:border-color .15s,background .15s,transform .12s,box-shadow .15s;
}
.opt:hover{border-color:rgba(159,166,255,.5);background:rgba(255,255,255,.07);transform:translateX(3px)}
.opt .key{
  width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:var(--muted);font-size:11.5px;font-weight:800;
  transition:background .15s,color .15s;
}
.opt[aria-checked="true"]{
  border-color:transparent;background:rgba(120,90,240,.16);
  box-shadow:0 0 0 2px var(--blue),0 12px 34px -12px rgba(120,90,240,.9);
}
.opt[aria-checked="true"] .key{background:var(--grad);color:#fff}

/* text inputs */
.field{position:relative;margin-top:6px}
.field input{
  width:100%;padding:14px 2px 15px;border:0;border-bottom:2px solid rgba(255,255,255,.18);
  background:transparent;font-size:clamp(19px,2.6vw,25px);font-weight:600;
  letter-spacing:-.02em;color:var(--ink);outline:none;
  transition:border-color .2s;font-family:inherit;
}
.field input::placeholder{color:#4E5167;font-weight:500}
.field input:focus{border-bottom-color:var(--blue);box-shadow:0 2px 18px -6px rgba(83,112,254,.9)}
.field.err input{border-bottom-color:#FF5C63}
.err-msg{color:#FF7A80;font-size:13.5px;font-weight:600;margin-top:10px;min-height:19px}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);transition:background-color 9999s}

/* nav */
.q-nav{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:28px;padding-top:22px;border-top:1px solid var(--line);
}
.back{
  background:none;border:0;cursor:pointer;padding:8px 0;
  font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
  transition:color .15s;
}
.back:hover{color:var(--ink)}
.back[hidden]{visibility:hidden;display:block}
.q-nav .right{display:flex;align-items:center;gap:20px}
.enter-hint{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#4E5167}
.cont{
  display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;
  padding:14px 30px;border-radius:999px;background:var(--grad);color:#fff;
  font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 10px 28px -8px rgba(120,90,240,.85);
  transition:transform .16s,opacity .16s,box-shadow .16s;
}
.cont::after{content:"→";letter-spacing:0;font-size:14px}
.cont:hover:not(:disabled){transform:translateY(-1px)}
.cont:disabled{background:rgba(255,255,255,.09);color:#5A5D74;box-shadow:none;cursor:not-allowed}

/* success */
.done{text-align:center;padding:clamp(38px,5vw,60px) clamp(24px,4vw,44px)}
.done .tick{
  width:66px;height:66px;border-radius:50%;background:var(--grad);margin:0 auto 24px;
  display:grid;place-items:center;box-shadow:0 16px 44px -10px rgba(120,90,240,.95);
}
.done .tick svg{width:28px;height:28px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done h3{font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:-.03em}
.done p{color:var(--muted);margin:14px auto 0;max-width:44ch;font-size:16px}
.done .recap{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:26px}
.done .recap span{
  padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink-2);
}

/* ══════════ STAT TILES ══════════ */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  width:min(700px,92vw);margin:22px auto 0;
  border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;
}
.stats div{padding:24px 16px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{
  display:block;font-family:var(--font-display);font-weight:400;
  font-size:clamp(24px,3.2vw,31px);letter-spacing:-.012em;line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.stats small{
  display:block;margin-top:9px;font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.5;
}

/* ══════════ TRUST BAR ══════════ */
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
.trust .cap{
  text-align:center;font-size:11px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:var(--faint);margin-bottom:30px;
}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.marquee ul{
  display:flex;list-style:none;margin:0;padding:0;width:max-content;
  animation:vslide var(--vdur,34s) linear infinite;
  will-change:transform;transform:translate3d(0,0,0);
}
.marquee li{
  display:flex;align-items:center;justify-content:center;height:52px;flex:none;
  font-size:16px;font-weight:800;letter-spacing:-.02em;color:#6C7089;white-space:nowrap;
}
/* white-on-transparent client logos. Height is set per logo in the CLIENTS
   array (they have very different aspect ratios); width follows the source
   ratio so nothing is ever distorted. */
.marquee li img{
  width:auto;max-width:180px;object-fit:contain;
  opacity:.9;display:block;
}
@media (max-width:620px){.marquee li img{transform:scale(.85)}}
@media (prefers-reduced-motion:reduce){.marquee ul{animation:none}}

/* ══════════ TINTED SECTION ══════════ */
.tinted{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tinted::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 44% at 50% 0%,rgba(83,112,254,.13),transparent 70%);
}
.tinted>*{position:relative}

/* ══════════ MECHANISM ══════════ */
.mech{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center;margin-top:52px}
.flow{display:grid;gap:9px}
.flow .step{
  display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;
  letter-spacing:-.012em;color:var(--ink-2);
}
.flow .step i{
  width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;font-style:normal;background:rgba(255,255,255,.08);color:var(--muted);
}
.flow .step.hot{
  color:var(--ink);border-color:transparent;background:rgba(120,90,240,.14);
  box-shadow:0 0 0 1.5px rgba(120,110,255,.7),0 14px 34px -16px rgba(120,90,240,.9);
}
.flow .step.hot i{background:var(--grad);color:#fff}
.flow .arw{text-align:center;color:#3E4158;font-size:13px;line-height:1;margin:-3px 0}
.mech-copy h3{margin-bottom:16px}
.mech-copy p{color:var(--muted);margin:0 0 16px}
.mech-copy .pull{
  border-left:3px solid transparent;border-image:var(--grad) 1;
  padding-left:20px;font-size:17.5px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.45;
}

/* ══════════ CREATIVE STRIP → seamless video marquee ══════════
   The track holds N copies of the 6 videos, then the WHOLE track is duplicated
   once. Every card carries its 16px gutter as margin-right (never `gap`), so the
   track is exactly 2x one sequence and translate3d(-50%) lands pixel-perfect on
   the identical frame. No snap, no gap. Duration is set in JS from the measured
   width so the speed stays constant at every breakpoint.                        */
.strip{
  overflow:hidden;margin-top:46px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.strip .vtrack{
  display:flex;list-style:none;margin:0;padding:0;width:max-content;
  animation:vslide var(--vdur,60s) linear infinite;
  will-change:transform;transform:translate3d(0,0,0);
}
@keyframes vslide{
  from{transform:translate3d(0,0,0)}
  to  {transform:translate3d(-50%,0,0)}
}
.strip .vtrack li{flex:none;width:clamp(150px,17vw,196px);margin-right:16px}
.strip .vtrack video{
  width:100%;aspect-ratio:9/16;object-fit:cover;display:block;border-radius:14px;
  background:#0E0E16;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 22px 48px -20px rgba(0,0,0,.9);
}
/* paused by IntersectionObserver while the section is off-screen (perf) */
.strip.is-paused .vtrack{animation-play-state:paused}

@media (prefers-reduced-motion:reduce){
  .strip{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .strip .vtrack{animation:none}
}
.strip-cap{text-align:center;margin-top:26px;font-size:13px;color:var(--faint)}

/* ══════════ RECEIPTS NUMBERS ══════════ */
.receipts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-top:44px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.rcard b{
  display:block;font-family:var(--font-display);font-weight:400;
  font-size:clamp(28px,3.8vw,38px);letter-spacing:-.015em;line-height:1;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.rcard small{display:block;margin-top:13px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.55}

/* ══════════ CASE STUDIES → supplied infographic artwork ══════════ */
.cases{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.case-graphic{
  margin:0;padding:0;display:block;width:100%;cursor:zoom-in;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow);
  appearance:none;-webkit-appearance:none;
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
.case-graphic img{width:100%;height:auto;display:block;object-fit:contain}
.case-graphic:hover{border-color:var(--line-2);transform:translateY(-3px);
  box-shadow:var(--shadow-lg)}
.case-graphic:focus-visible{outline:2px solid #9FA6FF;outline-offset:3px}

/* lightbox */
.lb{
  position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:20px;
  background:rgba(4,4,8,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.lb.on{display:grid}
.lb img{
  max-width:min(560px,94vw);max-height:94vh;width:auto;height:auto;
  border-radius:16px;box-shadow:0 40px 110px -30px #000;
}
.lb-close{
  position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line-2);background:rgba(255,255,255,.08);color:#fff;
  font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;
}
.lb-close:hover{background:rgba(255,255,255,.16)}
body.lb-open{overflow:hidden}

/* ══════════ INCLUDED ══════════ */
.inc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:46px}
/* `> div` on purpose: a plain `.inc div` also matches the .n badge inside each
   card, which made the badge inherit the card's padding and border. */
.inc > div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px}
.inc > div b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.inc > div small{display:block;margin-top:8px;font-size:14px;color:var(--muted);line-height:1.55}
.inc > div .n{
  width:46px;height:46px;flex:none;padding:0;border:0;border-radius:14px;
  background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:17px;font-weight:800;line-height:1;
  margin:0 auto 18px;                 /* centred across the card */
  box-shadow:0 8px 22px -8px rgba(120,90,240,.9);
}

/* ══════════ TIMELINE ══════════ */
.tl{margin-top:48px;display:grid;gap:0;position:relative}
.tl::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:linear-gradient(180deg,#5370FE,#FD66C5);opacity:.5;border-radius:2px}
.tl .row{display:grid;grid-template-columns:28px 1fr;gap:20px;padding:13px 0;align-items:start}
.tl .row i{
  width:28px;height:28px;border-radius:50%;background:var(--bg-2);border:2px solid rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--muted);font-style:normal;z-index:1;
}
.tl .row.on i{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(140,100,250,.8)}
.tl .row b{display:block;font-size:16px;font-weight:800;letter-spacing:-.022em}
.tl .row small{display:block;margin-top:4px;font-size:14.5px;color:var(--muted);line-height:1.55}

/* ══════════ FAQ ══════════ */
.faq{margin-top:44px;display:grid;gap:11px}
.faq details{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  transition:background .2s,border-color .2s;
}
.faq details[open]{background:var(--surface-2);border-color:var(--line-2);box-shadow:var(--shadow)}
.faq summary{
  list-style:none;cursor:pointer;padding:22px 24px;display:flex;align-items:center;
  justify-content:space-between;gap:18px;font-size:16.5px;font-weight:700;letter-spacing:-.02em;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{
  content:"+";flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:17px;font-weight:400;color:#9FA6FF;background:rgba(255,255,255,.04);
  transition:transform .22s;
}
.faq details[open] summary::after{content:"–";transform:rotate(180deg)}
.faq .ans{padding:0 24px 24px;color:var(--muted);font-size:15.5px;line-height:1.65;max-width:64ch}

/* ══════════ FINAL CTA ══════════ */
.final{
  width:min(820px,92vw);margin:0 auto;text-align:center;
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line-2);border-radius:28px;
  padding:clamp(40px,5.5vw,68px) clamp(26px,5vw,64px);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.final::before{
  content:"";position:absolute;inset:auto -30% -60% -30%;height:320px;
  background:radial-gradient(50% 100% at 50% 100%,rgba(120,90,240,.34),transparent 70%);
}
.final::after{
  content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(159,166,255,.7),transparent);
}
.final>*{position:relative}
.final p{color:var(--muted);margin:20px auto 0;max-width:52ch}
.final .btn{margin-top:32px}

/* ══════════ FOOTER ══════════ */
footer{border-top:1px solid var(--line);padding:44px 0;margin-top:clamp(60px,8vw,100px);background:var(--bg-2)}
footer .in{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
footer .tiny{max-width:none}

/* ══════════ RESPONSIVE ══════════ */
@media (max-width:900px){
  .mech{grid-template-columns:1fr;gap:36px}
  .cases{grid-template-columns:1fr}
}
@media (max-width:620px){
  body{font-size:16px}

  .stats div{border-right:0;border-bottom:1px solid var(--line);padding:20px 14px}

  .btn{padding:17px 30px;font-size:12px;width:100%}
  .q-nav{flex-direction:row}
  .cont{padding:13px 22px}
  .opt{padding:15px 16px;font-size:15.5px}
}

<body>

<div class="crm wrap">

  <!-- ══════════ SIGN IN ══════════ -->
  <div class="signin" id="signin">

        <button data-f="yes"  aria-pressed="false">Qualified</button>
        <button data-f="no"   aria-pressed="false">Not qualified</button>
      </div>
      <div class="seg" role="group" aria-label="Filter by date">
        <button data-d="7"   aria-pressed="false">7d</button>
        <button data-d="30"  aria-pressed="false">30d</button>
        <button data-d="90"  aria-pressed="false">90d</button>
        <button data-d="all" aria-pressed="true">All time</button>
      </div>

          <tr>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const C = window.CONFIG || {};
const $ = (id) => document.getElementById(id);

if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) {
  $('signinMsg').className = 'signin-msg err';
  $('signinMsg').textContent = 'Add SUPABASE_URL and SUPABASE_ANON_KEY at the top of crm.html.';
  $('signinBtn').disabled = true;
}

const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY)
  ? createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY)
  : null;

let LEADS = [];
let filterFit = 'all', filterDays = 'all', query = '';
let sortKey = 'created_at', sortDir = -1;

/* ═══ AUTH ═══ */
$('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!sb) return;
  const msg = $('signinMsg');
  msg.className = 'signin-msg'; msg.textContent = 'Signing in…';
  $('signinBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $('em').value.trim(), password: $('pw').value
  });
  $('signinBtn').disabled = false;
  if (error) { msg.className = 'signin-msg err'; msg.textContent = error.message; return; }
  msg.textContent = '';
  boot();
});

$('signoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  $('signin').hidden = true;
  $('dash').hidden = false;
  $('whoAmI').textContent = session.user.email;
  await load();
  live();
}

/* ═══ DATA ═══ */
async function load() {
  const { data, error } = await sb
    .from('leads').select('*').order('created_at', { ascending: false }).limit(5000);
  if (error) { console.error(error); return; }
  LEADS = data || [];
  render();
}

function live() {
  sb.channel('leads-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'leads' },
      (p) => { LEADS.unshift(p.new); render(); })
    .subscribe();
}

/* ═══ FILTER + SORT ═══ */
function visible() {
  const now = Date.now();
  const days = filterDays === 'all' ? Infinity : Number(filterDays);
  const q = query.trim().toLowerCase();
  let out = LEADS.filter((l) => {
    if (filterFit === 'yes' && !l.qualified) return false;
    if (filterFit === 'no' && l.qualified) return false;
    if (days !== Infinity && (now - new Date(l.created_at).getTime()) > days * 864e5) return false;
    if (q) {
      const hay = `${l.full_name||''} ${l.email||''} ${l.phone||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  out.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'created_at') { x = new Date(x); y = new Date(y); }
    if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  return out;
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const fmtDate = (d) => new Date(d).toLocaleString('en-GB',
  { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });

/* ═══ RENDER ═══ */
function render() {
  const rows = visible();

  // headline numbers, from everything not just the filtered view
  const q = LEADS.filter(l => l.qualified).length;
  const wk = LEADS.filter(l => Date.now() - new Date(l.created_at).getTime() < 7 * 864e5).length;
  const scores = LEADS.map(l => l.lead_score).filter(n => typeof n === 'number');
  const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '—';
  $('stats').innerHTML = [
    [LEADS.length, 'Total leads'],
    [q, 'Qualified'],
    [LEADS.length - q, 'Done-with-you'],
    [wk, 'Last 7 days'],
    [avg, 'Avg lead score'],
  ].map(([n, l]) => `<div><b>${esc(n)}</b><small>${l}</small></div>`).join('');

  $('rows').innerHTML = rows.map((l, i) => `
    <tr data-i="${i}">
      <td>${fmtDate(l.created_at)}</td>
      <td class="name">${esc(l.full_name)}</td>
      <td>${esc(l.email)}</td>
      <td>${esc(l.phone || '—')}</td>
      <td>${esc(l.monthly_revenue_label || '—')}</td>
      <td>${esc(l.industry_label || '—')}</td>
      <td><span class="pill ${l.qualified ? 'yes' : 'no'}">${l.qualified ? 'Qualified' : 'Not qualified'}</span></td>
      <td>${esc(l.utm_source || 'direct')}</td>
    </tr>`).join('');

  const none = rows.length === 0;
  $('empty').hidden = !none;
  if (none) $('empty').innerHTML = LEADS.length
    ? '<b>Nothing matches those filters</b>Try widening the date range or clearing the search.'
    : '<b>No leads yet</b>They will appear here the moment someone completes the form.';
  $('count').textContent = `Showing ${rows.length} of ${LEADS.length} leads`;

  [...$('rows').querySelectorAll('tr')].forEach((tr) =>
    tr.addEventListener('click', () => openLead(rows[Number(tr.dataset.i)])));

  document.querySelectorAll('thead th').forEach((th) => {
    const k = th.dataset.s;
    th.querySelector('.arrow').textContent = k === sortKey ? (sortDir === -1 ? '▼' : '▲') : '';
  });
}

/* ═══ DETAIL ═══ */
function openLead(l) {
  if (!l) return;
  const row = (k, v) => v ? `<div class="drow"><dt>${k}</dt><dd>${v}</dd></div>` : '';
  $('drawerBody').innerHTML = `
    <h2>${esc(l.full_name)}</h2>
    <p class="sub">${fmtDate(l.created_at)} ·
      <span class="pill ${l.qualified ? 'yes' : 'no'}">${l.qualified ? 'Qualified' : 'Not qualified'}</span></p>

    <div class="dgroup"><h3>Contact</h3>
      ${row('Email', `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`)}
      ${row('Phone', l.phone ? `<a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>` : '')}
      ${row('First name', esc(l.first_name))}
      ${row('Last name', esc(l.last_name))}
    </div>

    <div class="dgroup"><h3>Qualification</h3>
      ${row('Monthly revenue', esc(l.monthly_revenue_label))}
      ${row('Industry', esc(l.industry_label))}
      ${row('Route', esc(l.route))}
      ${row('Offer', esc(l.offer))}
      ${row('Lead score', esc(l.lead_score))}
    </div>

    <div class="dgroup"><h3>Attribution</h3>
      ${row('UTM source', esc(l.utm_source))}
      ${row('UTM medium', esc(l.utm_medium))}
      ${row('UTM campaign', esc(l.utm_campaign))}
      ${row('UTM content', esc(l.utm_content))}
      ${row('UTM term', esc(l.utm_term))}
      ${row('Facebook click ID', esc(l.fbclid))}
      ${row('Google click ID', esc(l.gclid))}
      ${row('Referrer', esc(l.referrer))}
      ${row('Landing page', esc(l.page_url))}
      ${row('Timezone', esc(l.timezone))}
    </div>

    <div class="actions">
      <a class="btn-sm primary" href="mailto:${esc(l.email)}?subject=${encodeURIComponent('Your 90-day lead plan')}">Email</a>
      ${l.phone ? `<a class="btn-sm" href="tel:${esc(l.phone)}">Call</a>` : ''}
    </div>`;
  $('drawer').classList.add('on');
  $('drawerClose').focus();
}
$('drawerClose').addEventListener('click', () => $('drawer').classList.remove('on'));
$('drawer').addEventListener('click', (e) => { if (e.target === $('drawer')) $('drawer').classList.remove('on'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('drawer').classList.remove('on'); });

/* ═══ CONTROLS ═══ */
$('q').addEventListener('input', (e) => { query = e.target.value; render(); });

document.querySelectorAll('.seg').forEach((seg) => {
  seg.addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    [...seg.children].forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    if (btn.dataset.f) filterFit = btn.dataset.f;
    if (btn.dataset.d) filterDays = btn.dataset.d;
    render();
  });
});

document.querySelectorAll('thead th').forEach((th) => {
  th.addEventListener('click', () => {
    const k = th.dataset.s;
    if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = -1; }
    render();
  });
});

/* ═══ CSV EXPORT (of what is currently on screen) ═══ */
$('exportBtn').addEventListener('click', () => {
  const rows = visible();
  if (!rows.length) return;
  const cols = ['created_at','full_name','first_name','last_name','email','phone',
    'monthly_revenue_label','industry_label','qualified','route','offer','lead_score',
    'utm_source','utm_medium','utm_campaign','utm_content','utm_term','referrer','page_url'];
  const cell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [cols.join(','), ...rows.map((r) => cols.map((c) => cell(r[c])).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `outwork-leads-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* already signed in? go straight through */
if (sb) boot();
</script>
